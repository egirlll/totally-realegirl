<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totally Real Egirl</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            border: 3px solid #ff1493;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 20, 147, 0.05);
        }

        .avatar {
            margin-bottom: 30px;
        }

        .avatar img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #ff1493;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.6);
        }

        h1 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #ff1493;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 20, 147, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 20, 147, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 20, 147, 0.2);
            color: #ff1493;
            border: 2px solid #ff1493;
        }

        .container {
            border: 3px solid #ff1493;
            padding: 40px;
            border-radius: 20px;
        }

        .btn-secondary:hover {
            background: rgba(255, 20, 147, 0.3);
        }

        .crypto-dropdown {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .crypto-btn {
            width: 100%;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background: rgba(30, 30, 50, 0.95);
            min-width: 100%;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            z-index: 1;
            border-radius: 8px;
            border: 2px solid #ff1493;
            margin-top: 5px;
        }

        .dropdown-content.active {
            display: block;
        }

        .dropdown-content button {
            padding: 12px 20px;
            width: 100%;
            border: none;
            background: none;
            color: #ff1493;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .dropdown-content button:first-child {
            border-radius: 6px 6px 0 0;
        }

        .dropdown-content button:last-child {
            border-radius: 0 0 6px 6px;
        }

        .dropdown-content button:hover {
            background: rgba(255, 20, 147, 0.2);
        }

        .copied-msg {
            display: none;
            color: #4ade80;
            font-size: 12px;
            margin-top: 5px;
        }

        .footer {
            margin-top: 40px;
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .avatar img {
                width: 120px;
                height: 120px;
            }

            h1 {
                font-size: 24px;
            }

            .btn {
                font-size: 14px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">
            <img src="pfp.jpg" alt="Totally Real Egirl">
        </div>

        <h1>Totally Real Egirl</h1>
        <p class="subtitle">It's totally safe to interact with me 💋</p>

        <div class="links">
            <button class="btn btn-primary" onclick="navigate('throne')">Throne</button>

            <a href="https://wheel-free.vercel.app/" class="btn btn-primary">🎡 Spin Wheel</a>

            <div class="crypto-dropdown" onclick="toggleDropdown()">
                <button class="btn btn-primary crypto-btn">Crypto ▼</button>
                <div class="dropdown-content" id="cryptoMenu">
                    <button onclick="copyAddress('BTC')">Bitcoin</button>
                    <button onclick="copyAddress('ETH')">Ethereum</button>
                    <button onclick="copyAddress('SOL')">Solana</button>
                </div>
            </div>

            <button class="btn btn-secondary" onclick="navigate('write')">Write For Me</button>

            <button class="btn btn-secondary" onclick="navigate('puzzle')">Puzzle</button>

            <button class="btn btn-secondary" onclick="navigate('autodrainer')">Auto Drainer</button>
        </div>

        <div class="footer">
            <p>All interactions are totally real 💋</p>
        </div>
    </div>

    <script>
        const links = {
            throne: 'https://throne.com/onemoresend',
            write: 'https://writeforme-kappa.vercel.app/',
            puzzle: 'https://puzzle-gray-ten.vercel.app/',
            autodrainer: 'https://gofile.io/d/YmSp4q'
        };

        const cryptoAddresses = {
            BTC: '1A1z7agoat4BTC...',
            ETH: '0x742d35Cc6634C0532925a3b844Bc9e7595f...',
            SOL: 'DYw8jCTfwHNRob...'
        };

        function navigate(type) {
            window.location.href = links[type];
        }

        function toggleDropdown() {
            const menu = document.getElementById('cryptoMenu');
            menu.classList.toggle('active');
        }

        function copyAddress(crypto) {
            navigator.clipboard.writeText(cryptoAddresses[crypto]).then(() => {
                alert(crypto + ' address copied!');
            });
        }

        document.addEventListener('click', function(event) {
            const dropdown = document.querySelector('.crypto-dropdown');
            if (!dropdown.contains(event.target)) {
                document.getElementById('cryptoMenu').classList.remove('active');
            }
        });
    </script>
</body>
</html>
